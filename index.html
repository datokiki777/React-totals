<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Client Totals" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2342" />
    <meta name="color-scheme" content="dark" />
    <title>Client Totals</title>
  </head>
  <body>
    <div id="root">
      <!--
        Static splash, shown the instant the HTML parses — before any JS
        has downloaded/parsed/executed. React replaces this the moment it
        mounts. This exists specifically to shrink the "flash of the wrong
        thing" window on a cold app-icon launch (the OS/browser can only
        paint whatever's already in the DOM until the framework takes
        over) — matches the app's real background/theme colors, so
        there's no jarring color-swap either.
      -->
      <div style="
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d2342;
        color: rgba(245, 247, 251, 0.6);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
