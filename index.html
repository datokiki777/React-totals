<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Client Totals" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1830" />
    <meta name="color-scheme" content="dark" />
    <title>Client Totals</title>
    <style>
      /*
        Critical, inlined CSS — deliberately duplicated from src/index.css's
        :root block (not imported/shared, since this must be available the
        INSTANT the HTML parses, with zero dependency on any external
        stylesheet request). This is what shrinks the gap between Android's
        own system splash (built from the manifest icon/theme_color, out of
        our control) disappearing and this page's first real paint — every
        millisecond spent waiting on a network round-trip for CSS before
        anything can render is a millisecond that gap can show through as
        the launcher underneath. Colors intentionally match src/index.css
        exactly; if that file's --surface-1/2/text tokens ever change,
        update these too.
      */
      html, body {
        margin: 0;
        padding: 0;
        background: #0a1830;
        color: #f5f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      #boot-shell .bar {
        height: 44px;
        border-radius: 999px;
        background: #142a4d;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      #boot-shell .bar.short {
        width: 40%;
      }
      #boot-shell .status {
        margin-top: 16px;
        text-align: center;
        color: rgba(245, 247, 251, 0.6);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Static app-shaped shell, painted the instant the HTML parses —
        before any JS has downloaded/parsed/executed, and with zero
        dependency on the external stylesheet (see the inlined <style>
        above). React replaces this the moment it mounts. Shaped like the
        real top bar (two pill rows) rather than a blank "Loading…" so the
        handoff from Android's system splash feels continuous instead of a
        blank-to-app jump.
      -->
      <div id="boot-shell">
        <div class="bar"></div>
        <div class="bar short"></div>
        <div class="status">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
